[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decisiongraph"
version = "1.0.0"
description = "Institutional memory + code intelligence graph for AI coding agents (MCP-compatible: Claude Code, Cursor, Cline, Continue, ...)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DecisionGraph contributors" }]
keywords = [
    "code-graph", "code-intelligence", "knowledge-graph",
    "mcp", "claude-code", "cursor", "ai-coding-tools",
    "decision-memory", "blast-radius", "pr-triage"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # ── LLM + RAG core ───────────────────────────────────────────────────
    "anthropic>=0.40.0",
    "sentence-transformers>=2.2.0",
    "python-dotenv>=1.0.0",

    # ── Knowledge graph ──────────────────────────────────────────────────
    "networkx>=3.0",
    "python-louvain>=0.16",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",

    # ── MCP protocol ─────────────────────────────────────────────────────
    "mcp>=1.0.0",

    # ── HTTP server (mcp_http + REST API) ────────────────────────────────
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "requests>=2.31.0",

    # ── Document ingestion (PDF / DOCX / XLSX / multimodal-lite) ─────────
    "pdfplumber>=0.10.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",   # web URL ingestion
    "lxml>=5.0.0",              # bs4 parser backend

    # ── Code graph: tree-sitter + language packs ─────────────────────────
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-go>=0.21.0",
    "tree-sitter-rust>=0.21.0",
    "tree-sitter-java>=0.21.0",
    "tree-sitter-c>=0.21.0",
    "tree-sitter-cpp>=0.21.0",
    "tree-sitter-ruby>=0.21.0",
    "tree-sitter-php>=0.22.0",

    # ── Agent token / scope-gate security ────────────────────────────────
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
# Extra tree-sitter language packs (so users can pick subsets)
all-langs = [
    "tree-sitter-c-sharp>=0.21.0",
    "tree-sitter-bash>=0.21.0",
    "tree-sitter-lua>=0.21.0",
    "tree-sitter-scala>=0.21.0",
    "tree-sitter-kotlin>=0.21.0",
    "tree-sitter-swift>=0.6.0",
    "tree-sitter-elixir>=0.3.0",
    "tree-sitter-haskell>=0.21.0",
    "tree-sitter-ocaml>=0.21.0",
    "tree-sitter-julia>=0.22.0",
    "tree-sitter-perl>=0.4.0",
    "tree-sitter-zig>=1.1.0",
    "tree-sitter-solidity>=1.2.5",
    "tree-sitter-sql>=0.3.0",
    "tree-sitter-svelte>=1.0.0",
    "tree-sitter-html>=0.21.0",
    "tree-sitter-css>=0.21.0",
    "tree-sitter-json>=0.21.0",
    "tree-sitter-yaml>=0.6.0",
    "tree-sitter-toml>=0.6.0",
    "tree-sitter-markdown>=0.3.0",
]
# Forecasting backend
forecast = [
    "statsmodels>=0.14.0",
    # TimesFM is heavy — install separately via timesfm-env conda recipe
]
# Browser-based viz tests + dev tooling
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "playwright>=1.40.0",
    "ruff>=0.1.0",
]

[project.scripts]
dg-code-graph = "decisiongraph.code_graph_cli:main"
dg-server     = "server:main"
dg-mcp        = "decisiongraph.mcp_server:_sync_main"

[project.urls]
Homepage      = "https://github.com/your-org/decisiongraph"
Documentation = "https://github.com/your-org/decisiongraph#readme"
Issues        = "https://github.com/your-org/decisiongraph/issues"

[tool.setuptools]
packages = ["decisiongraph", "agentnet"]
include-package-data = true

[tool.setuptools.package-data]
decisiongraph = ["_vis_network.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
