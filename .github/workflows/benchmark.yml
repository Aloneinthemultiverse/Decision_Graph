name: F1 benchmark gate

on:
  pull_request:
    paths:
      - 'decisiongraph/code_graph.py'
      - 'decisiongraph/codebase_ast.py'
      - 'bench/**'
  push:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -e .
          pip install tree_sitter tree_sitter_python tree_sitter_javascript \
                      tree_sitter_typescript tree_sitter_go tree_sitter_rust \
                      tree_sitter_java tree_sitter_ruby tree_sitter_c \
                      tree_sitter_cpp

      - name: Run F1 benchmark (strict)
        run: python bench/run_benchmark.py --strict --max-regression 0.05

      - name: Upload bench logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-logs
          path: .bench/
